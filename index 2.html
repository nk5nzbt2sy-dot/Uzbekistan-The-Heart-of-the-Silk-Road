<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uzbekistan: The Heart of the Silk Road</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#061425;--fg:#f7f3e8;--dim:#9fb3c8;--gold:#f7b731;--line:rgba(247,243,232,.35);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{margin:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:700 12px/1.8 'Space Mono',ui-monospace,monospace;letter-spacing:.08em}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;z-index:2;pointer-events:none}
.vig{inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(3,9,18,.78))}
nav{top:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 0}
nav b{display:flex;align-items:center;gap:14px;padding:8px 18px;border:1px solid var(--line);border-radius:99px;background:rgba(6,20,37,.55);backdrop-filter:blur(8px)}
nav i{position:relative;width:56px;height:1px;background:var(--line)}
nav u{position:absolute;left:0;top:-.5px;height:2px;width:0;background:var(--gold)}
#hero{left:5vw;top:20vh}
#hero small{display:block;color:var(--gold)}
h1{font:700 clamp(38px,10.5vw,112px)/1 'Space Mono',ui-monospace,monospace;letter-spacing:0;margin:10px 0 14px;text-shadow:0 0 28px rgba(47,208,232,.45)}
#hero em{font-style:normal;font-size:clamp(13px,2.2vw,22px);color:var(--gold)}
#chn{left:5vw;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);list-style:none}
#chn button{pointer-events:auto;cursor:pointer;background:none;border:0;color:var(--dim);font:inherit;letter-spacing:inherit;text-align:left;transition:color .3s}
#chn button.on{color:var(--fg)}
#chn button.on::before{content:"→ "}
#chn button:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
.r{right:5vw;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);text-align:right}
#end{left:5vw;top:14vh;font:700 clamp(36px,9vw,96px)/1 'Space Mono',ui-monospace,monospace;color:var(--gold);opacity:0}
#end small{display:block;font-size:13px;color:var(--fg);margin-top:10px}
@media(max-width:600px){#chn{display:none}}
</style></head><body>
<nav class="ui"><b><span id="cn">Intro</span><i><u id="pg"></u></i><span id="cc">00 / 22</span></b></nav>
<div class="ui" id="hero"><small>REPUBLIC OF UZBEKISTAN</small><h1>Uzbekistan</h1><em>The Heart of the Silk Road</em></div>
<div class="ui" id="end">Rahmat!<small>Thank you for listening</small></div>
<ul class="ui" id="chn"></ul>
<aside class="ui r" id="lab">SCROLL ↓</aside>
<div class="ui vig"></div>
<div style="height:1800vh"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const W=()=>innerWidth,H=()=>innerHeight,rm=matchMedia('(prefers-reduced-motion:reduce)').matches?0:1;
const CH=[['Overview',0,190],['Geography',6,42],['History',10,205],['Cities',14,28],['Culture',18,140],['Flag',21,200]];
const FL=[['Blue: sky and water','#2fb6e0'],['White: peace','#f4f1ff'],['Green: nature and renewal','#22b14c'],['Red lines: the force of life','#e5384f']];
const C=[
['Tashkent','Capital and largest city'],['37M+','People, the most populous country in Central Asia'],['448,978 km²','Total area'],
['1 Sept 1991','Independence Day'],['Uzbek','Official language; Russian is also widely spoken'],["So'm",'National currency (UZS)'],
['Double-Landlocked','One of only two doubly landlocked countries in the world, together with Liechtenstein.'],
['Varied land','The Kyzylkum desert, the Tian Shan mountains and the fertile Fergana Valley.'],
['The Aral Sea','Once one of the largest lakes on Earth, it has shrunk dramatically and is now a major environmental challenge.'],
['5 neighbours',['Kazakhstan','Kyrgyzstan','Tajikistan','Afghanistan','Turkmenistan']],
['2nd c. BC','Silk Road caravans link China, India, Persia and Europe'],['9th–12th c.','Golden Age of science: al-Khwarizmi, al-Biruni, Ibn Sina'],
['1370','Amir Temur builds his empire with Samarkand as its capital'],['15th c.','Ulugh Beg builds a great astronomical observatory'],
['Samarkand','Registan Square and its three grand madrasas, a UNESCO World Heritage site'],
['Bukhara','A historic centre of mosques, markets and minarets, listed by UNESCO'],
['Tashkent','A modern capital with a famous metro whose stations look like palaces'],
['Khiva','Itchan Kala, a walled inner city and the first Uzbek site on the UNESCO list'],
['Plov','The national dish of rice, meat, carrots and onions, cooked in a big kazan. UNESCO recognises its traditions as intangible cultural heritage.'],
['Navruz','The spring New Year on 21 March, celebrated with music, dancing, sumalak and family gatherings.'],
['Crafts','Suzani embroidery, ikat silk from Margilan and blue Rishtan ceramics keep ancient skills alive.'],
['Flag of Uzbekistan',FL]];
const N=C.length,STEP=8,chOf=i=>{let k=0;CH.forEach((c,j)=>{if(i>=c[1])k=j});return k};
const wrap=(x,t,X,Y,w,lh)=>{let l='';for(const wd of t.split(' ')){const n=l?l+' '+wd:wd;if(x.measureText(n).width>w&&l){x.fillText(l,X,Y);Y+=lh;l=wd}else l=n}x.fillText(l,X,Y);return Y+lh};
let r;try{r=new THREE.WebGLRenderer({antialias:true})}catch(e){document.body.insertAdjacentHTML('beforeend','<p style="position:fixed;top:45%;width:100%;text-align:center">This page needs WebGL.</p>');return}
r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(W(),H());r.setClearColor(0x061425);document.body.prepend(r.domElement);
Promise.all([document.fonts.load('700 40px "Space Mono"'),document.fonts.load('400 34px "Space Mono"')]).then(go,go);
function go(){
const s=new THREE.Scene();s.fog=new THREE.FogExp2(0x061425,.017);
const cam=new THREE.PerspectiveCamera(60,W()/H(),.1,300);
let mob,dist;const lay=()=>{mob=W()<H();dist=mob?8.6:4;cam.aspect=W()/H();cam.updateProjectionMatrix();r.setSize(W(),H())};lay();
// realistic dust: soft round sprites, varied depth, twinkle, drifting bokeh
const NP=16000,L=16+STEP*(N-1)+30,P=new Float32Array(NP*3),CO=new Float32Array(NP*3),SZ=new Float32Array(NP),PH=new Float32Array(NP);
const pal=['#f7b731','#f7b731','#2fd0e8','#2fd0e8','#f7f3e8','#f7f3e8','#22b14c'].map(c=>new THREE.Color(c));
for(let i=0;i<NP;i++){const a=Math.random()*6.283,d=1.2+Math.pow(Math.random(),.7)*16,c=pal[Math.random()*7|0];
P.set([Math.cos(a)*d,Math.sin(a)*d*.6,8-Math.random()*L],i*3);CO.set([c.r,c.g,c.b],i*3);
SZ[i]=Math.random()<.04?14+Math.random()*14:.5+Math.random()*1.1;PH[i]=Math.random()}
const g=new THREE.BufferGeometry();[['position',P,3],['col',CO,3],['size',SZ,1],['ph',PH,1]].forEach(a=>g.setAttribute(a[0],new THREE.BufferAttribute(a[1],a[2])));
const pm=new THREE.ShaderMaterial({uniforms:{t:{value:0},pr:{value:r.getPixelRatio()}},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
vertexShader:`attribute vec3 col;attribute float size,ph;uniform float t,pr;varying vec3 vc;varying float va;
void main(){vc=col;vec3 p=position;p.x+=sin(t*.3+ph*6.28)*.35;p.y+=cos(t*.25+ph*9.)*.3;
vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;float d=-mv.z;
gl_PointSize=min(size*pr*(40./max(d,1.)),220.);
va=(size>10.?.09:.9)*(.7+.3*sin(t*(1.+ph*2.)+ph*40.))*smoothstep(95.,12.,d)*smoothstep(.4,3.,d);}`,
fragmentShader:`varying vec3 vc;varying float va;void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;float a=smoothstep(.5,0.,d);a*=a*va;gl_FragColor=vec4(vc*(1.+a),a);}`});
const pts=new THREE.Points(g,pm);pts.frustumCulled=false;s.add(pts);
// emblem: two rotated squares (8-pointed star)
const emb=new THREE.Group();[[0x0aa5c2,.785],[0xf7b731,1.57]].forEach(([c,a])=>{const m=new THREE.Mesh(new THREE.TorusGeometry(1.2,.07,8,4),new THREE.MeshBasicMaterial({color:c}));m.rotation.z=a;emb.add(m)});s.add(emb);
// glass cards
const mk=i=>{const [ti,bo]=C[i],ci=chOf(i),h=CH[ci][2];
const cv=document.createElement('canvas');cv.width=1024;cv.height=640;const x=cv.getContext('2d');
const gr=x.createLinearGradient(0,0,0,640);gr.addColorStop(0,'#0f3358');gr.addColorStop(1,'#071a31');x.fillStyle=gr;x.fillRect(0,0,1024,640);
for(let k=0;k<9;k++){const X=Math.random()*1024,Y=Math.random()*330,R=90+Math.random()*190,q=x.createRadialGradient(X,Y,0,X,Y,R);q.addColorStop(0,`hsla(${h+Math.random()*70-20},90%,60%,.42)`);q.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=q;x.fillRect(0,0,1024,640)}
x.strokeStyle='rgba(247,243,232,.28)';x.lineWidth=3;x.strokeRect(18,18,988,604);
x.fillStyle='#f7b731';x.font='700 26px "Space Mono",monospace';x.fillText(CH[ci][0].toUpperCase(),56,86);
let f=76;x.fillStyle='#f7f3e8';do{x.font=`700 ${f}px "Space Mono",monospace`;f-=4}while(x.measureText(ti).width>910&&f>32);x.fillText(ti,56,196);
x.font='400 34px "Space Mono",monospace';let y=290;
(Array.isArray(bo)?bo:[bo]).forEach(it=>{const [t,c]=typeof it=='string'?[it,0]:it;let X=56;x.fillStyle='#d6e2ee';
if(c){x.fillStyle=c;x.beginPath();x.arc(66,y-11,10,0,6.283);x.fill();x.fillStyle='#d6e2ee';X=92}y=wrap(x,t,X,y,968-X,46)});
const tex=new THREE.CanvasTexture(cv);tex.anisotropy=r.capabilities.getMaxAnisotropy();
const m=new THREE.Mesh(new THREE.PlaneGeometry(4.6,2.875),new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:.96,side:THREE.DoubleSide}));
const col=new THREE.Color().setHSL(h/360,.75,.6);
m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:col})));
const gl=new THREE.Mesh(new THREE.PlaneGeometry(5.3,3.6),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.1,blending:THREE.AdditiveBlending,depthWrite:false}));gl.position.z=-.03;m.add(gl);
m.position.z=-10-STEP*i;s.add(m);return m};
const cards=C.map((_,i)=>mk(i));
// interface
const $=id=>document.getElementById(id),hero=$('hero'),lab=$('lab'),cn=$('cn'),cc=$('cc'),pg=$('pg'),end=$('end'),chn=$('chn');
const pad=n=>String(n).padStart(2,'0'),Dd=()=>16+STEP*(N-1)-dist;
chn.innerHTML=CH.map((c,j)=>`<li><button data-i="${c[1]}">${c[0]}</button></li>`).join('');
chn.onclick=e=>{const b=e.target.closest('button');if(!b)return;const t=(6+10+STEP*b.dataset.i-dist)/Dd();scrollTo({top:t*(document.documentElement.scrollHeight-H()),behavior:rm?'auto':'smooth'})};
let sc=0,mx=0,my=0,tx=0,ty=0,last=-2;
addEventListener('mousemove',e=>{tx=e.clientX/W()*2-1;ty=e.clientY/H()*2-1});
addEventListener('touchmove',e=>{const t=e.touches[0];tx=t.clientX/W()*2-1;ty=t.clientY/H()*2-1},{passive:true});
addEventListener('resize',lay);
(function loop(t){requestAnimationFrame(loop);
const T0=t*.001*rm,max=document.documentElement.scrollHeight-H(),tp=max>0?scrollY/max:0;
sc+=(tp-sc)*.07;mx+=(tx-mx)*.05;my+=(ty-my)*.05;
const cz=6-sc*Dd();cam.position.set(mx*.8,-my*.45,cz);cam.lookAt(mx*.3,-my*.15,cz-10);
pm.uniforms.t.value=T0;
emb.position.set(mob?0:2.6,mob?1.7:.2,-3);emb.rotation.set(0,Math.sin(T0*.5)*.7,T0*.1);
cards.forEach((m,i)=>{m.position.x=mob?0:(i%2?2.8:-2.8);m.position.y=Math.sin(T0*.8+i*1.7)*.2;m.rotation.y=(mob?.12:.38)*(i%2?-1:1)});
hero.style.opacity=Math.max(0,1-(6-cz)/6);end.style.opacity=Math.max(0,Math.min(1,(sc-.96)*25));pg.style.width=sc*100+'%';
const k=Math.min(N-1,Math.round((dist-cz-10)/STEP));
if(k!==last){last=k;const ci=k<0?-1:chOf(k);
lab.innerHTML=k<0?'SCROLL ↓':`${CH[ci][0]}<br>${pad(k+1)} / ${N}<br>${C[k][0]}`;
cn.textContent=k<0?'Intro':CH[ci][0];cc.textContent=`${pad(k+1)} / ${N}`;
chn.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('on',j===ci))}
r.render(s,cam)})(0);
}
})();
</script></body></html>
